[package]
name = "eqts"
version = "0.2.1"
description = "One Rust API for TypeScript across native JavaScript runtimes"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
eqts-macros = { path = "../eqts-macros", version = "0.2.1" }
inventory = "0.3"
napi = { version = "=3.12.1", default-features = false, features = ["napi6", "serde-json"], optional = true }
napi-derive = { version = "=3.6.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", features = ["executor"] }
wasm-bindgen = { version = "=0.2.121", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = ["node-napi"]
node-napi = ["dep:napi", "dep:napi-derive"]
node-koffi = []
bun = []
deno = []
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:serde-wasm-bindgen", "dep:js-sys"]

[lints]
workspace = true
