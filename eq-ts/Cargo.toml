[package]
name = "eqts"
version = "0.2.1"
description = "One Rust API for TypeScript across native JavaScript runtimes"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
eqts-macros = { path = "../eqts-macros", version = "0.2.1" }
inventory = "0.3"
napi = { version = "=3.12.1", default-features = false, features = ["napi6", "serde-json"], optional = true }
# 3.6.3 breaks under fresh resolution: it pairs its own convert_case 0.11 with
# napi-derive-backend ^6.1.2 resolving to 6.1.3+, which switched to convert_case
# 0.12 — nine E0308 "expected Case<'static>, found Case<'_>" errors in the
# napi-derive parser. Fixed upstream in 3.6.4 (convert_case ^0.12 + backend
# ^6.1.3); stay on the fixed lineage. The pinned napi-derive-backend dependency
# below keeps the backend and convert_case versions from drifting apart again.
napi-derive = { version = "=3.6.9", optional = true }
napi-derive-backend = { version = "=6.1.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", features = ["executor"] }
wasm-bindgen = { version = "=0.2.121", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = ["node-napi"]
node-napi = ["dep:napi", "dep:napi-derive", "dep:napi-derive-backend"]
node-koffi = []
bun = []
deno = []
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:serde-wasm-bindgen", "dep:js-sys"]

[lints]
workspace = true
