name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: examples/add
        run: bun install --frozen-lockfile
      - working-directory: examples/add
        run: bun x napi build --platform --release --target ${{ matrix.target }} --output-dir dist/node-napi --js index.js --dts index.d.ts --esm --features node-napi
      - run: cargo build --manifest-path examples/add/Cargo.toml --release --locked --target ${{ matrix.target }} --no-default-features --features node-koffi,bun,deno
      - uses: actions/upload-artifact@v4
        with:
          name: eqts-${{ matrix.target }}
          path: |
            examples/add/dist/node-napi
            examples/add/target/${{ matrix.target }}/release
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: examples/add
        run: bun install --frozen-lockfile
      - run: cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - run: cargo install --path cargo-eqts --locked --debug
      - working-directory: examples/add
        run: bun run build:wasm
      - working-directory: examples/add
        run: cargo eqts build --target wasm-browser --release
      - working-directory: examples/add
        run: bun run typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: eqts-wasm
          path: |
            examples/add/dist/wasm
            examples/add/dist/wasm-browser
          if-no-files-found: error

  release-bundle:
    needs: [prebuild, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: find artifacts -type f -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: eqts-release-${{ github.ref_name }}
          path: artifacts
          if-no-files-found: error
